name: oneayat
description: "ONE AYAT — One Day. One Ayat. Offline-first daily Quran companion."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  just_audio: ^0.9.46
  google_mobile_ads: ^5.3.1
  intl: ^0.20.2
  share_plus: ^11.0.0
  home_widget: ^0.9.0
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  geolocator: ^13.0.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
